<!DOCTYPE html>
<html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>አስተዳዳሪ · Admin</title>
<style>
:root{--bg:#EEF1EE;--sf:#fff;--ink:#14302B;--mu:#52645F;--ln:#D3DBD6;--br:#14302B;--on:#F2F5F1;--ac:#B7791F;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A18;--sf:#18262A;--ink:#E8EEEA;--mu:#9DB0AA;--ln:#2B3C39;--br:#E8EEEA;--on:#0F1A18;--ac:#E0A94A}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Ethiopic",system-ui,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}h1{font-size:1.4rem;margin:8px 0 16px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox]{width:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:2px solid var(--br);background:var(--br);color:var(--on);cursor:pointer}
button.alt{background:transparent;color:var(--ink)}button.del{background:#B3261E;border-color:#B3261E;color:#fff}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.item img,.ph{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--ln);flex:none}
.item .t{flex:1;min-width:0}.item small{color:var(--mu)}.imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.imgs label{font-weight:400;margin:0;font-size:.85rem}.imgs img{width:72px;height:72px;object-fit:cover;border-radius:8px;display:block}
.msg{color:var(--ac);font-weight:600;min-height:1.5em}
@media (max-width:520px){.row{grid-template-columns:1fr}}
</style></head><body><div class="w">
<h1>ሞገስ ፈርኒቸር · አስተዳዳሪ</h1>

<div id="login" class="box" hidden>
  <label>የይለፍ ቃል</label><input id="pw" type="password" autocomplete="current-password">
  <p class="msg" id="lmsg"></p><button id="lbtn">ግባ</button>
</div>

<div id="app" hidden>
  <div class="box">
    <h2 id="ftitle" style="margin:0 0 4px;font-size:1.1rem">አዲስ ምርት ጨምር</h2>
    <form id="f">
      <div class="row"><div><label>ዓይነት</label>
        <select id="cat"><option value="sofa">ሶፋ</option><option value="bed">አልጋ</option><option value="table">የመመገቢያ ጠረጴዛ</option></select></div>
      <div id="subw"><label>የሶፋ ዓይነት</label>
        <select id="sub"><option value="1">ባለ 1 ወንበር</option><option value="2">ባለ 2 ወንበር</option><option value="3" selected>ባለ 3 ወንበር</option><option value="L">ኤል ቅርጽ</option></select></div></div>
      <label>ስም (አማርኛ)</label><input id="name_am" required>
      <label>Name (English)</label><input id="name_en">
      <label>መግለጫ (አማርኛ)</label><textarea id="desc_am" rows="2"></textarea>
      <label>Description (English)</label><textarea id="desc_en" rows="2"></textarea>
      <label>ዋጋ (ብር)</label><input id="price" type="number" min="0" inputmode="numeric">
      <label><input id="stock" type="checkbox" checked> ይገኛል (ካልተመረጠ "ተሽጧል" ይታያል)</label>
      <label>ፎቶዎች (እስከ 8)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
      <div class="imgs" id="old"></div>
      <p class="msg" id="msg"></p>
      <button type="submit" id="save">አስቀምጥ</button> <button type="button" class="alt" id="cancel" hidden>ተው</button>
    </form>
  </div>
  <div class="box"><strong>ምርቶች</strong><div id="list"></div></div>
  <button class="alt" id="out">ውጣ</button> <a href="/" style="margin-left:12px;color:var(--ink)">ድረ-ገጹን ተመልከት</a>
</div>

<script>
var $=function(i){return document.getElementById(i)}, items=[], editing=null, keep=[];
var CATS={sofa:"ሶፋ",bed:"አልጋ",table:"ጠረጴዛ"};
function api(u,o){return fetch(u,o).then(function(r){ if(r.status===401){ show(false); throw new Error("login"); } return r.json(); });}
function show(ok){ $("login").hidden=ok; $("app").hidden=!ok; }
$("lbtn").onclick=function(){
  fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("pw").value})})
   .then(function(r){ if(r.ok){ $("lmsg").textContent=""; start(); } else $("lmsg").textContent="የይለፍ ቃሉ ትክክል አይደለም"; });
};
$("pw").onkeydown=function(e){ if(e.key==="Enter") $("lbtn").click(); };
$("out").onclick=function(){ fetch("/api/logout",{method:"POST"}).then(function(){ show(false); }); };
$("cat").onchange=function(){ $("subw").hidden=$("cat").value!=="sofa"; };

function load(){ return api("/api/products").then(function(d){ items=d; draw(); }); }
function draw(){
  var l=$("list"); l.innerHTML="";
  if(!items.length){ l.textContent="ምርት የለም።"; return; }
  items.forEach(function(p){
    var d=document.createElement("div"); d.className="item";
    var im=p.images[0]?'<img alt="" src="'+p.images[0]+'">':'<div class="ph"></div>';
    d.innerHTML=im+'<div class="t"><div></div><small></small></div><button class="alt">አስተካክል</button><button class="del">አጥፋ</button>';
    d.querySelector(".t div").textContent=p.name_am;
    d.querySelector("small").textContent=CATS[p.cat]+" · "+p.price+" ብር"+(p.inStock?"":" · ተሽጧል");
    var b=d.querySelectorAll("button");
    b[0].onclick=function(){ edit(p); };
    b[1].onclick=function(){ if(confirm("ይህን ምርት ማጥፋት እርግጠኛ ነህ?")) api("/api/products/"+p.id,{method:"DELETE"}).then(load); };
    l.appendChild(d);
  });
}
function reset(){ editing=null; keep=[]; $("f").reset(); $("old").innerHTML=""; $("cancel").hidden=true; $("ftitle").textContent="አዲስ ምርት ጨምር"; $("cat").onchange(); }
function edit(p){
  editing=p.id; keep=p.images.slice();
  $("cat").value=p.cat; $("sub").value=p.sub||"3"; $("name_am").value=p.name_am; $("name_en").value=p.name_en;
  $("desc_am").value=p.desc_am; $("desc_en").value=p.desc_en; $("price").value=p.price; $("stock").checked=p.inStock;
  $("cat").onchange(); $("cancel").hidden=false; $("ftitle").textContent="ምርት አስተካክል";
  var o=$("old"); o.innerHTML="";
  p.images.forEach(function(u){
    var lb=document.createElement("label"); lb.innerHTML='<img alt="" src="'+u+'"><input type="checkbox" checked> አቆይ';
    lb.querySelector("input").onchange=function(e){ keep=e.target.checked?keep.concat(u):keep.filter(function(x){return x!==u;}); };
    o.appendChild(lb);
  });
  window.scrollTo(0,0);
}
$("cancel").onclick=reset;
$("f").onsubmit=function(e){
  e.preventDefault();
  var fd=new FormData();
  fd.append("cat",$("cat").value); fd.append("sub",$("sub").value);
  ["name_am","name_en","desc_am","desc_en","price"].forEach(function(k){ fd.append(k,$(k).value); });
  fd.append("inStock",$("stock").checked); fd.append("keep",JSON.stringify(keep));
  Array.prototype.forEach.call($("photos").files,function(f){ fd.append("photos",f); });
  $("msg").textContent="በማስቀመጥ ላይ…";
  api(editing?"/api/products/"+editing:"/api/products",{method:editing?"PUT":"POST",body:fd})
   .then(function(){ $("msg").textContent="ተቀምጧል!"; reset(); return load(); })
   .catch(function(){ $("msg").textContent="አልተቀመጠም። ስሙን እና ፎቶውን ይመልከቱ።"; });
};
function start(){ show(true); reset(); load(); }
fetch("/api/me").then(function(r){return r.json();}).then(function(d){ d.admin?start():show(false); });
</script></div></body></html>
